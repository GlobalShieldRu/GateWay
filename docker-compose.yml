volumes:
  gsg_config:
    driver: local
  dhcp_data:
    driver: local

# Сетевая конфигурация контейнеров берётся из ОС (`ip route`/`ip addr`) и
# settings.json (DHCP-пул). Env vars GSG_GATEWAY_IP/GSG_LAN_INTERFACE/
# GSG_DHCP_START/END удалены — они дублировали то что уже в ОС и приводили
# к рассинхронизации (инцидент 2026-05-13, серия hotfix-релизов v1.13.2-4).
# Контейнеры все network_mode: host — видят настоящие интерфейсы хоста.

services:
  # Оркестратор - веб-интерфейс управления
  web-orchestrator:
    build:
      context: ./web-orchestrator
      network: host
    container_name: gsg-web-orchestrator
    network_mode: "host"
    volumes:
      - gsg_config:/etc/gsg
      - dhcp_data:/var/lib/misc:ro
    environment:
      - TELEGRAM_BOT_TOKEN=8502362211:AAHkFjHvTfyMw8RpEyE_iy60m5ofOATy1wQ
      - TELEGRAM_NOTIFY_USERS_CHAT_ID=-1002944439448
    restart: always

  # DHCP Сервер - раздача IP и регистрация имен
  # iface/IP/gateway → автодетект из ip route. DHCP-пул → settings.json.
  registry-dhcp:
    build:
      context: ./registry-dhcp
      network: host
    container_name: gsg-dhcp
    privileged: true
    network_mode: "host"
    volumes:
      - gsg_config:/etc/gsg
      - dhcp_data:/var/lib/misc
    restart: always

  # Tunnel Provider - работа с прокси и подписками
  tunnel-provider:
    build:
      context: ./tunnel-provider
      network: host
    container_name: gsg-tunnel
    network_mode: "host"
    privileged: true
    volumes:
      - gsg_config:/etc/gsg
    environment:
      - GSG_TPROXY_PORT=12345
      - ENABLE_DEPRECATED_LEGACY_DNS_SERVERS=true
    restart: always

  # Net Enforcer - управление правилами nftables (TPROXY)
  # LAN_CIDR → автодетект из ip route в net-enforcer/main.py.
  net-enforcer:
    build:
      context: ./net-enforcer
      network: host
    container_name: gsg-netenforcer
    privileged: true
    network_mode: "host"
    volumes:
      - gsg_config:/etc/gsg
    environment:
      - GSG_TPROXY_PORT=12345
    restart: always
