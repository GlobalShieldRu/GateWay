volumes:
  gsg_config:
    driver: local
  dhcp_data:
    driver: local

# Устройство-специфичные параметры берутся ТОЛЬКО из .env (создаётся install.sh).
# .env находится в .gitignore и НЕ перезаписывается при OTA `git reset`.
# Синтаксис ${VAR:?msg} — docker compose упадёт с ясной ошибкой если VAR не задан.
# Это лучше чем дефолт: предотвращает «GSG поднялся с настройками другого устройства»
# (раньше дефолт 10.10.1.139/eth0 ломал NanoPi после каждого OTA, потому что NanoPi=10.10.1.254/end0).

services:
  # Оркестратор - веб-интерфейс управления
  web-orchestrator:
    build:
      context: ./web-orchestrator
      network: host
    container_name: gsg-web-orchestrator
    network_mode: "host"
    volumes:
      - gsg_config:/etc/gsg
      - dhcp_data:/var/lib/misc:ro
    environment:
      - GSG_GATEWAY_IP=${GSG_GATEWAY_IP:?требуется .env с GSG_GATEWAY_IP — запустить install.sh}
      - TELEGRAM_BOT_TOKEN=8502362211:AAHkFjHvTfyMw8RpEyE_iy60m5ofOATy1wQ
      - TELEGRAM_NOTIFY_USERS_CHAT_ID=-1002944439448
    restart: always

  # DHCP Сервер - раздача IP и регистрация имен
  registry-dhcp:
    build:
      context: ./registry-dhcp
      network: host
    container_name: gsg-dhcp
    privileged: true
    network_mode: "host"
    volumes:
      - gsg_config:/etc/gsg
      - dhcp_data:/var/lib/misc
    environment:
      - GSG_GATEWAY_IP=${GSG_GATEWAY_IP:?требуется .env}
      - GSG_LAN_INTERFACE=${GSG_LAN_INTERFACE:?требуется .env с GSG_LAN_INTERFACE (end0/eth0)}
      - GSG_DHCP_START=${GSG_DHCP_START:?требуется .env с GSG_DHCP_START}
      - GSG_DHCP_END=${GSG_DHCP_END:?требуется .env с GSG_DHCP_END}
    restart: always

  # Tunnel Provider - работа с прокси и подписками
  tunnel-provider:
    build:
      context: ./tunnel-provider
      network: host
    container_name: gsg-tunnel
    network_mode: "host"
    privileged: true
    volumes:
      - gsg_config:/etc/gsg
    environment:
      - GSG_TPROXY_PORT=12345
      - ENABLE_DEPRECATED_LEGACY_DNS_SERVERS=true
    restart: always

  # Net Enforcer - управление правилами nftables (TPROXY)
  net-enforcer:
    build:
      context: ./net-enforcer
      network: host
    container_name: gsg-netenforcer
    privileged: true
    network_mode: "host"
    volumes:
      - gsg_config:/etc/gsg
    environment:
      - GSG_GATEWAY_IP=${GSG_GATEWAY_IP:?требуется .env}
      - GSG_TPROXY_PORT=12345
      - GSG_LAN_INTERFACE=${GSG_LAN_INTERFACE:?требуется .env}
    restart: always
